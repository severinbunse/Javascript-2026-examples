<!DOCTYPE html> <!-- Tells the browser this is an HTML5 document -->
<html>
<head>
    <meta charset="utf-8"> <!-- Use standard UTF-8 text encoding -->
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Make the page render correctly on mobile screens -->
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Image Click</title> <!-- Text shown in the browser tab -->
</head>
<body>

<!-- The onclick attribute calls changeImage() directly whenever this
     image is clicked — no addEventListener needed. -->
<img id="myImage" src="images/lightOff.png" onclick="changeImage()">

<script src="image-click.js"></script>

</body>
</html>
