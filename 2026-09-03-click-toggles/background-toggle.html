<!DOCTYPE html> <!-- Tells the browser this is an HTML5 document -->
<html>
<head>
    <meta charset="utf-8"> <!-- Use standard UTF-8 text encoding -->
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Make the page render correctly on mobile screens -->
    <title>Background Toggle</title>
</head>
<body>

    <!-- A clickable button. Its id ("toggleButton") is how our JavaScript
         finds this exact element on the page. -->
    <button id="toggleButton">Toggle background</button>

    <!-- Load our JavaScript file. Placing it at the end of <body> ensures
         the button above already exists on the page before the script
         tries to find it. -->
    <script src="background-toggle.js"></script>

</body>
</html>
