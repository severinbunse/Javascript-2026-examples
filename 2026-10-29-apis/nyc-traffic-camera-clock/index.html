<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Clock</title>

<style>

    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: sans-serif;
        background-color: black;
    }

    /* the camera image fills the screen behind the text */
    #image {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* keep the text above the image */
    #time, #place {
        position: relative;
        z-index: 1;
    }

    #time {
        font-size: 9vw;
        margin: 0;
        color: red;
        white-space: nowrap;
        text-shadow: 5px 5px 0 black;
    }

    #place {
        font-size: 3vw;
        margin: 0;
        color: red;
        text-shadow: 2px 2px 0 black;
    }

</style>

</head>
<body>

    <img id="image">
    <h1 id="time"></h1>
    <p id="place"></p>

<script src="script.js"></script>

</body>
</html>
