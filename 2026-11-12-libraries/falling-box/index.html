<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falling box</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;   /* no scrollbars */
        }
    </style>
</head>
<body>

<!-- STEP 1: Load the library. It adds a Matter object to our page. -->
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>

<script>

    // STEP 2: The engine does the physics: gravity, movement, collisions.
    const engine = Matter.Engine.create();

    // STEP 3: The renderer draws the engine's world into a <canvas>.
    // Docs: https://brm.io/matter-js/docs/
    const render = Matter.Render.create({
        element: document.body,          // where to put the canvas
        engine: engine,                  // which engine to draw
        options: {
            width: window.innerWidth,
            height: window.innerHeight,
            wireframes: false,           // filled shapes, not outlines
            background: 'white'
        }
    });

    // STEP 4: The bodies. x and y are the CENTER of a shape.
    const w = window.innerWidth;
    const h = window.innerHeight;

    // rectangle(x, y, width, height, options)
    const box = Matter.Bodies.rectangle(w / 2, 0, 80, 80, {
        angle: 0.5,                      // tilt, in radians
        restitution: 0.6,                // bounciness, 0 to 1
        render: { fillStyle: 'royalblue' }
    });

    const ground = Matter.Bodies.rectangle(w / 2, h - 30, w, 60, {
        isStatic: true,                  // never moves
        render: { fillStyle: 'black' }
    });

    // STEP 5: Add the bodies to the world and start.
    Matter.Composite.add(engine.world, [box, ground]);
    Matter.Render.run(render);                            // start drawing
    Matter.Runner.run(Matter.Runner.create(), engine);    // start the physics

</script>

</body>
</html>
