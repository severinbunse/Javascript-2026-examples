<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confetti</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

<button>Celebrate</button>

<!-- STEP 1: Load the library.
     This file was written by someone else. It adds a function called confetti() to our page. -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<script>

    const button = document.querySelector('button');

    // STEP 2: Call the function.
    // The simplest version: confetti() with no options. Uncomment to try it.
    
    // button.addEventListener('click', function() {
    //     confetti();
    // });

    // STEP 3: Add options.
    // Options go inside { } as key: value pairs.
    // The library decides the keys (particleCount, spread, ...). We decide the values.
    // You can only find the keys in the docs: https://github.com/catdad/canvas-confetti
    // Some to try inside confetti( ):
    // confetti({ particleCount: 300, spread: 120 });
    // confetti({ colors: ['red', 'blue'] });
    // confetti({ origin: { x: 0, y: 1 }, angle: 60 });

    // STEP 4: Use letters instead of confetti.
    // shapeFromText() is another function from the library. It turns text into a confetti shape.
    // We make the shapes once here, not on every click.
    const size = 3;   // how big the letters are. We use it twice below, so we only change it here.

    // Letters ignore the colors option, so each letter gets its own color and font.
    const letterA = confetti.shapeFromText({ text: 'A', scalar: size, color: 'red', fontFamily: 'Times' });
    const letterB = confetti.shapeFromText({ text: 'B', scalar: size, color: 'blue', fontFamily: 'Arial' });
    const letterC = confetti.shapeFromText({ text: 'C', scalar: size, color: 'green', fontFamily: 'Courier' });

    button.addEventListener('click', function() {
        confetti({
            shapes: [letterA, letterB, letterC],   // the shapes to use, in a list [ ]
            scalar: size,                          // the size, same as above (scalar means "multiplier")
            particleCount: 50,                     // how many pieces
            spread: 360,                           // how wide they fly, in degrees. 360 is a full circle.
            ticks: 1000                            // how long they stay before fading. Default is 200.
        });
    });

</script>

</body>
</html>
