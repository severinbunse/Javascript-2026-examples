<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confetti</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

<button>Celebrate</button>

<!-- STEP 1: Load the library. It adds a confetti() function to our page. -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<script>

    const button = document.querySelector('button');

    // STEP 2: Call confetti() with options. Uncomment to try.
    // Options are key: value pairs. Find the keys in the docs:
    // https://github.com/catdad/canvas-confetti

    // button.addEventListener('click', function() {
    //     confetti({
    //         particleCount: 300,          // how many pieces
    //         spread: 120,                 // how wide, in degrees
    //         colors: ['red', 'blue'],
    //         origin: { x: 0.5, y: 0.5 }   // start point, 0 to 1
    //     });
    // });

    // STEP 3: Letters instead of confetti.
    const size = 3;

    // Letters ignore colors, so each one gets its own color and font.
    const letterA = confetti.shapeFromText({ text: 'A', scalar: size, color: 'red', fontFamily: 'Times' });
    const letterB = confetti.shapeFromText({ text: 'B', scalar: size, color: 'blue', fontFamily: 'Arial' });
    const letterC = confetti.shapeFromText({ text: 'C', scalar: size, color: 'green', fontFamily: 'Courier' });

    button.addEventListener('click', function() {
        confetti({
            shapes: [letterA, letterB, letterC],
            scalar: size,        // size multiplier
            particleCount: 50,
            spread: 360,         // full circle
            ticks: 1000          // how long they stay
        });
    });

</script>

</body>
</html>
